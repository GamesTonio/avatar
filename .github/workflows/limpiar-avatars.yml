name: Limpiar Avatars Hackeados

on:
  workflow_dispatch: # Esto permite que lo actives manualmente con un botón

jobs:
  delete-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out el repositorio
        uses: actions/checkout@v4

      - name: Eliminar archivos mayores a 6000
        run: |
          # Cambia a la carpeta avatars (asegúrate de que el nombre coincida exactamente)
          cd avatars
          
          # Buscamos todos los archivos en la carpeta
          for archivo in *; do
            # Extraemos solo la parte numérica del nombre (ej: "6543.png" -> "6543")
            nombre_sin_ext="${archivo%.*}"
            
            # Verificamos si es un número válido
            if [[ "$nombre_sin_ext" =~ ^[0-9]+$ ]]; then
              # Si el número es mayor a 6000, lo eliminamos
              if [ "$nombre_sin_ext" -gt 6000 ]; then
                echo "Eliminando: $archivo"
                rm "$archivo"
              fi
            fi
          done

      - name: Confirmar y subir cambios a GitHub
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add avatars/
          
          # Solo hace commit si realmente se borraron archivos
          git diff --quiet && git diff --staged --quiet || (git commit -m "Limpieza automática: Eliminados avatares mayores a 6000" && git push)
